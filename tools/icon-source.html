<!DOCTYPE html>
<!-- Source artwork for the PWA icons (rendered to PNG by tools/make-icons.mjs).
     Same identity as the cover screen: dark wood scene, faint gold board grid, one cream game tile with a dark-green letter and its value.
     Query string: ?size=512&shape=any|full   any = rounded corners on transparent (manifest "any"), full = full-bleed square (maskable, Apple touch icon). -->
<meta charset="utf-8">
<style>
@font-face{font-family:IconAmiri;font-weight:700;src:url('../assets/fonts/Amiri-Bold.woff2') format('woff2')}
@font-face{font-family:IconTinos;font-weight:700;src:url('../assets/fonts/Tinos-Bold.woff2') format('woff2')}
html,body{margin:0;background:transparent}svg{display:block}
</style>
<body>
<svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="wood" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#4a2d1b"/><stop offset="1" stop-color="#24150c"/></radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fcf5de"/><stop offset="1" stop-color="#e6d4a0"/></linearGradient>
    <radialGradient id="fade" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
    <mask id="gridMask"><rect width="512" height="512" fill="url(#fade)"/></mask>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse" x="0" y="0">
      <path d="M56 0H0V56" fill="none" stroke="#d4af37" stroke-opacity=".30" stroke-width="2"/>
    </pattern>
    <clipPath id="clip"><rect id="clipRect" width="512" height="512" rx="0"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#wood)"/>
    <rect width="512" height="512" fill="url(#grid)" mask="url(#gridMask)"/>
    <!-- tile: 270 px keeps its corners inside the 80 % maskable safe circle (half-diagonal 191 < 204) -->
    <g filter="url(#drop)">
      <rect x="121" y="121" width="270" height="270" rx="34" fill="url(#tile)"/>
    </g>
    <rect x="121.75" y="121.75" width="268.5" height="268.5" rx="33.5" fill="none" stroke="#5a3a1a" stroke-opacity=".55" stroke-width="1.5"/>
    <path d="M146 123.5H366" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
    <text id="letter" font-family="IconAmiri" font-weight="700" font-size="215" fill="#14532d">ع</text>
    <text id="value" font-family="IconTinos" font-weight="700" font-size="54" fill="#14532d" text-anchor="end" x="368" y="374">8</text>
  </g>
</svg>
<script>
(async () => {
  const q = new URLSearchParams(location.search), size = +q.get('size') || 512, full = q.get('shape') === 'full';
  await Promise.all([document.fonts.load('700 215px IconAmiri', 'ع'), document.fonts.load('700 54px IconTinos', '8')]);
  const svg = document.getElementById('art'); svg.setAttribute('width', size); svg.setAttribute('height', size);
  document.getElementById('clipRect').setAttribute('rx', full ? 0 : 112);
  // centre the INK of the glyph (not its em box) in the upper part of the tile, above the value digit; same idea as GLYPH in js/config.js
  const c = document.createElement('canvas').getContext('2d'); c.font = '700 215px IconAmiri';
  const m = c.measureText('ع'), inkW = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, inkH = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
  const L = document.getElementById('letter');
  L.setAttribute('x', 256 - inkW / 2 + m.actualBoundingBoxLeft);
  L.setAttribute('y', 252 - inkH / 2 + m.actualBoundingBoxAscent);
  document.body.dataset.ready = '1';
})();
</script>
</body>
